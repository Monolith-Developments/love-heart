    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #ff204e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Symmetrical stage container with responsive auto-fit scaling */
    #heartStage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 960px;
      height: 720px;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
      transform-origin: center center;
      pointer-events: none;
    }

    .word {
      position: absolute;
      white-space: nowrap;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #ff204e;
      text-shadow:
        0 0 3px rgba(255, 32, 78, 0.85),
        0 0 8px rgba(255, 32, 78, 0.45);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.35);
      transition: opacity 0.35s ease-out, transform 0.35s ease-out;
      will-change: transform, opacity;
      pointer-events: none;
      line-height: 1;
    }

    .word.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Gentle pulsing after the drawing completes */
    .heart-pulsing {
      animation: heartbeat 2s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: translate(-50%, -50%) scale(var(--scale, 1));
      }
      50% {
        transform: translate(-50%, -50%) scale(calc(var(--scale, 1) * 1.025));
      }
    }
  </style>

    // Responsive scaling to fit any viewport

      const scaleY = (window.innerHeight * 0.95) / 720;

    updateScale();

    // Start audio immediately on load
    function initAudio() {
      if (!audio) return;
      audio.play().catch(() => {
        // Silent fallback for strict browser autoplay policies
        const unlock = () => {
          audio.play().catch(() => {});
          window.removeEventListener("pointerdown", unlock);
          window.removeEventListener("keydown", unlock);
        };
        window.addEventListener("pointerdown", unlock, { once: true });
        window.addEventListener("keydown", unlock, { once: true });
      });
    }

    // Create words and animate immediately on page load
    function initHeart() {
      stage.innerHTML = "";
      stage.classList.remove("heart-pulsing");

      const wordElements = [];

      WORDS_DATA.forEach((item) => {
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = item.text;
        span.style.left = item.x + "px";
        span.style.top = item.y + "px";
        stage.appendChild(span);
        wordElements.push(span);
      });

      // Animate word by word sequentially (matching reel timing: ~75ms per word)
      const delayPerWord = 75;
      wordElements.forEach((el, index) => {
        setTimeout(() => {
          el.classList.add("visible");
          if (index === wordElements.length - 1) {
            setTimeout(() => {
              stage.classList.add("heart-pulsing");
            }, 300);
          }
        }, index * delayPerWord);
      });
    }

    // Run automatically on load or immediately if already loaded
    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", () => {
        initAudio();
        initHeart();
      });
    } else {
      initAudio();
      initHeart();
    }

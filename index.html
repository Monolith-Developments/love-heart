<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #ff204e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Symmetrical stage container with responsive auto-fit scaling */
    #heartStage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 960px;
      height: 720px;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
      transform-origin: center center;
      pointer-events: none;
    }

    .word {
      position: absolute;
      white-space: nowrap;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #ff204e;
      text-shadow:
        0 0 3px rgba(255, 32, 78, 0.85),
        0 0 8px rgba(255, 32, 78, 0.45);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.35);
      transition: opacity 0.35s ease-out, transform 0.35s ease-out;
      will-change: transform, opacity;
      pointer-events: none;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
    }

    .word.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Gentle pulsing after the drawing completes */
    .heart-pulsing {
      animation: heartbeat 2s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: translate(-50%, -50%) scale(var(--scale, 1));
      }
      50% {
        transform: translate(-50%, -50%) scale(calc(var(--scale, 1) * 1.025));
      }
    }

    /* Tap-to-start overlay (required for audio on mobile) */
    #tapOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.88);
      border: 0;
      color: #ff204e;
      font-family: inherit;
      cursor: pointer;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #tapOverlay[hidden] { display: none; }
    #tapOverlay .tap-heart { font-size: 52px; line-height: 1; animation: tapPulse 1.6s ease-in-out infinite; }
    #tapOverlay .tap-title { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; text-align: center; }
    #tapOverlay .tap-error { font-size: 13px; font-weight: 600; color: #ffb3c1; text-align: center; max-width: 320px; }
    @keyframes tapPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Sound toggle */
    #soundBtn {
      position: fixed;
      right: calc(14px + env(safe-area-inset-right));
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 5;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 32, 78, 0.55);
      background: rgba(0, 0, 0, 0.6);
      color: #ff204e;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #soundBtn[hidden] { display: none; }
  </style>
</head>
<body>

  <!-- Heart Stage Container -->
  <div id="heartStage"></div>

  <!-- Tap-to-start overlay: mobile browsers block audio before a user gesture -->
  <button id="tapOverlay" type="button" aria-label="Click me">
    <span class="tap-heart" aria-hidden="true">&#10084;&#65039;</span>
    <span class="tap-title">click me</span>
    <span class="tap-error" id="tapError" hidden></span>
  </button>

  <button id="soundBtn" type="button" aria-label="Toggle sound" hidden>&#9836;</button>

    <source src="reel_audio.m4a" type="audio/mp4">

  </audio>

    const stage = document.getElementById("heartStage");
    const audio = document.getElementById("bgMusic");
    const overlay = document.getElementById("tapOverlay");
    const tapError = document.getElementById("tapError");
    const soundBtn = document.getElementById("soundBtn");
    let heartStarted = false;
    let audioUnlocked = false;

    // Responsive scaling to fit any viewport (incl. mobile browser chrome).
    // Uses visualViewport when available so rotation / URL-bar show-hide recenters.
    function viewportSize() {
      const vv = window.visualViewport;
      if (vv && vv.width > 0 && vv.height > 0) {
        return { w: vv.width, h: vv.height };
      }
      return {
        w: document.documentElement.clientWidth || window.innerWidth,
        h: document.documentElement.clientHeight || window.innerHeight
      };
    }
    function updateScale() {
      const { w, h } = viewportSize();
      const margin = w < 600 ? 0.98 : 0.95; // use almost full width on phones
      const scaleX = (w * margin) / 960;
      const scaleY = (h * margin) / 720;
      const scale = Math.min(scaleX, scaleY, 1.25);
      stage.style.setProperty("--scale", scale);
    }
    window.addEventListener("resize", updateScale);
    window.addEventListener("orientationchange", updateScale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateScale);
    }

    function showAudioError(msg) {

    function playAudio() {

      return audio.play().then(() => {
        audioUnlocked = true;
        updateSoundBtn();
      }).catch((err) => {
        throw err;
      });
    }

    function updateSoundBtn() {

    // Best-effort desktop autoplay; mobile will fall through to the overlay.
    function initAudio() {
      if (!audio) return;
      audio.load();
      playAudio().catch(() => {

          playAudio().catch(() => {});
          window.removeEventListener("pointerdown", unlock);
          window.removeEventListener("touchend", unlock);
          window.removeEventListener("keydown", unlock);
        };
        window.addEventListener("pointerdown", unlock);
        window.addEventListener("touchend", unlock);
        window.addEventListener("keydown", unlock);
      });
      audio.addEventListener("error", () => {
        showAudioError("Music file could not play on this device. Tap again to retry.");
      }, { once: true });
    }

    function dismissOverlay() {
      if (overlay) overlay.hidden = true;
    }

    // Create words and animate immediately on page load

      stage.innerHTML = "";
      stage.classList.remove("heart-pulsing");

      const wordElements = [];

      WORDS_DATA.forEach((item) => {
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = item.text;
        span.style.left = item.x + "px";
        span.style.top = item.y + "px";
        stage.appendChild(span);
        wordElements.push(span);
      });

      // Animate word by word sequentially (matching reel timing: ~75ms per word)
      const delayPerWord = 75;
      wordElements.forEach((el, index) => {
        setTimeout(() => {
          el.classList.add("visible");
          if (index === wordElements.length - 1) {
            setTimeout(() => {
              stage.classList.add("heart-pulsing");
            }, 300);
          }
        }, index * delayPerWord);
      });
    }

    function startExperience() {
      if (heartStarted) return;
      heartStarted = true;
      dismissOverlay();
      initHeart();
      playAudio().catch(() => {
        // Keep the heart animating even if audio is blocked (e.g. silent switch).
        updateSoundBtn();
      });

      // touchend fires faster than click on old mobile browsers
      overlay.addEventListener("touchend", (e) => {
        e.preventDefault();
        startExperience();
      }, { passive: false });
    }

    if (soundBtn) {
      soundBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!audio) return;
        if (audio.paused) {
          playAudio().catch(() => showAudioError("Tap again — audio is still blocked."));

        }
        updateSoundBtn();
      });

      });

    }
